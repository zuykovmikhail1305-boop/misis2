<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Planner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>AI Learning Planner</h1>
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul>
                <li><a href="#" onclick="showSection('create-plan')">Создать план</a></li>
                <li><a href="#" onclick="showSection('my-plans')">Мои планы</a></li>
            </ul>
        </div>
    </nav>
    
    <main class="container">
        <div id="alert-container"></div>
        
        <!-- Create Plan Section -->
        <section id="create-plan-section" class="section">
            <h2>Создать новый учебный план</h2>
            <form id="create-plan-form">
                <div class="form-group">
                    <label for="goal">Цель обучения</label>
                    <input type="text" id="goal" name="goal" required placeholder="Например: Изучить Python">
                </div>
                
                <div class="form-group">
                    <label for="level">Уровень подготовки</label>
                    <select id="level" name="level" required>
                        <option value="beginner">Начинающий</option>
                        <option value="intermediate">Средний</option>
                        <option value="advanced">Продвинутый</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="duration_weeks">Длительность (недель)</label>
                    <input type="number" id="duration_weeks" name="duration_weeks" min="1" max="52" value="4" required>
                </div>
                
                <div class="form-group">
                    <label for="time_per_week">Часов в неделю</label>
                    <input type="number" id="time_per_week" name="time_per_week" min="1" max="40" value="5" required>
                </div>
                
                <div class="form-group">
                    <label for="preferred_format">Предпочтительный формат</label>
                    <select id="preferred_format" name="preferred_format" required>
                        <option value="practice">Практика</option>
                        <option value="theory">Теория</option>
                        <option value="mixed">Смешанный</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Создать план</button>
            </form>
        </section>
        
        <!-- My Plans Section -->
        <section id="my-plans-section" class="section hidden">
            <h2>Мои учебные планы</h2>
            <div id="plans-list" class="plan-list">
                <div class="loading">Загрузка планов...</div>
            </div>
        </section>
        
        <!-- Plan Detail Section -->
        <section id="plan-detail-section" class="section hidden">
            <button onclick="showSection('my-plans')" class="btn btn-secondary btn-small">Назад к списку</button>
            <div id="plan-detail-content" style="margin-top: 20px;"></div>
        </section>
    </main>
    
    <footer>
        <div class="container">
            <p>AI Learning Planner - Ваш персональный помощник в обучении</p>
        </div>
    </footer>
    
    <script src="/static/app.js"></script>
</body>
</html>
